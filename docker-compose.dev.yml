# ===========================================
# i-Damoa Frontend - Development
# ===========================================
# Dev 환경: IP:3000 직접 접근
#
# Usage:
#   docker compose -f docker-compose.dev.yml pull
#   docker compose -f docker-compose.dev.yml up -d

services:
  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-interior-damoa/i-damoa-frontend}:dev
    container_name: damoa-frontend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - damoa-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  damoa-network:
    external: true
