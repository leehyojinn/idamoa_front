name: Deploy Frontend to Production

on:
  pull_request:
    types: [closed]
    branches:
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    if: github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod-latest
            type=sha,prefix=prod-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.PROD_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_KAKAO_APP_KEY=${{ secrets.PROD_NEXT_PUBLIC_KAKAO_APP_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.PROD_NEXT_PUBLIC_TOSS_CLIENT_KEY }}
            NEXT_PUBLIC_CDN_URL=${{ secrets.PROD_NEXT_PUBLIC_CDN_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.PROD_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,IMAGE_NAME
          script: |
            echo "🔐 Logging in to GitHub Container Registry..."
            echo $GHCR_TOKEN | docker login ghcr.io -u github-actions --password-stdin

            echo "📥 Pulling new image..."
            docker pull ghcr.io/$IMAGE_NAME:prod-latest

            echo "🛑 Stopping old container..."
            docker stop damoa-frontend-prod || true
            docker rm damoa-frontend-prod || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name damoa-frontend-prod \
              --restart unless-stopped \
              --network damoa-network \
              --network nginx-network \
              ghcr.io/$IMAGE_NAME:prod-latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "⏳ Health check..."
            sleep 5
            for i in {1..30}; do
              if docker exec damoa-frontend-prod wget --no-verbose --tries=1 --spider http://127.0.0.1:3000 2>/dev/null; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "Waiting... ($i/30)"
              sleep 3
            done

            echo "🔄 Reloading Nginx to update upstream..."
            docker exec nginx-core nginx -s reload
            echo "✅ Nginx reloaded!"

            echo "📊 Container status:"
            docker ps | grep damoa-frontend-prod || true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ github.repository }}

      - name: Send Slack notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend PRODUCTION 배포 성공!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PRODUCTION Frontend 배포 성공* :rocket:\n*환경:* Production (운영)\n*브랜치:* master\n*방식:* GitHub Actions 빌드\n*작성자:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send Slack notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend PRODUCTION 배포 실패!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*PRODUCTION Frontend 배포 실패* :x:\n*환경:* Production (운영)\n*브랜치:* master\n*작성자:* ${{ github.actor }}\n*로그:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
