name: Deploy Frontend to Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=dev-latest
            type=sha,prefix=dev-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.DEV_NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_KAKAO_APP_KEY=${{ secrets.DEV_NEXT_PUBLIC_KAKAO_APP_KEY }}
            NEXT_PUBLIC_TOSS_CLIENT_KEY=${{ secrets.DEV_NEXT_PUBLIC_TOSS_CLIENT_KEY }}
            NEXT_PUBLIC_CDN_URL=${{ secrets.DEV_NEXT_PUBLIC_CDN_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Dev EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEV_EC2_SSH_KEY }}
          command_timeout: 10m
          envs: GHCR_TOKEN,IMAGE_NAME
          script: |
            echo "🔐 Logging in to GitHub Container Registry..."
            echo $GHCR_TOKEN | docker login ghcr.io -u github-actions --password-stdin

            echo "📥 Pulling new image..."
            docker pull ghcr.io/$IMAGE_NAME:dev-latest

            echo "🛑 Stopping old container..."
            docker stop damoa-frontend-dev || true
            docker rm damoa-frontend-dev || true

            echo "🚀 Starting new container..."
            docker run -d \
              --name damoa-frontend-dev \
              --restart unless-stopped \
              --network damoa-network \
              -p 3000:3000 \
              ghcr.io/$IMAGE_NAME:dev-latest

            echo "🧹 Cleaning up old images..."
            docker image prune -f

            echo "⏳ Health check..."
            sleep 5
            for i in {1..20}; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "Waiting... ($i/20)"
              sleep 3
            done

            echo "📊 Container status:"
            docker ps | grep damoa-frontend-dev || true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ github.repository }}

      - name: Send Slack notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend Dev 배포 성공!",
              "blocks": [
                {
                  "type": "section",  
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend 배포 성공* :rocket:\n*환경:* Development\n*브랜치:* develop\n*방식:* GitHub Actions 빌드\n*작성자:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send Slack notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend Dev 배포 실패!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend 배포 실패* :x:\n*환경:* Development\n*브랜치:* develop\n*작성자:* ${{ github.actor }}\n*로그:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
