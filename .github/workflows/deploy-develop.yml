name: Deploy Frontend to Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy on Dev EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy source to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/damoa/frontend/source"
          rm: true

      - name: Build and Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd ~/damoa/frontend/source

            # .env 파일에서 환경변수 읽기
            if [ -f ~/damoa/frontend/.env ]; then
              set -a
              source ~/damoa/frontend/.env
              set +a
              echo "✅ .env 파일 로드 완료"
              echo "   NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
            else
              echo "❌ .env 파일이 없습니다. ~/damoa/frontend/.env 파일을 생성해주세요."
              exit 1
            fi

            # Docker 빌드 시간 측정
            echo "🔨 Docker 빌드 시작..."
            BUILD_START=$(date +%s)

            docker build \
              --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
              --build-arg NEXT_PUBLIC_KAKAO_APP_KEY="$NEXT_PUBLIC_KAKAO_APP_KEY" \
              --build-arg NEXT_PUBLIC_TOSS_CLIENT_KEY="$NEXT_PUBLIC_TOSS_CLIENT_KEY" \
              -t damoa-frontend-dev:latest .

            BUILD_END=$(date +%s)
            BUILD_TIME=$((BUILD_END - BUILD_START))
            echo "✅ Docker 빌드 완료 (${BUILD_TIME}초)"

            # 기존 컨테이너 중지 및 제거
            docker stop damoa-frontend-dev || true
            docker rm damoa-frontend-dev || true

            # 새 컨테이너 실행
            docker run -d \
              --name damoa-frontend-dev \
              --restart unless-stopped \
              --network damoa-network \
              -p 3000:3000 \
              damoa-frontend-dev:latest

            # 이전 이미지 정리
            docker image prune -f

            # 헬스체크 대기
            echo "⏳ 헬스체크 대기..."
            for i in {1..20}; do
              if curl -f http://localhost:3000 > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                break
              fi
              echo "Waiting... ($i/20)"
              sleep 3
            done

            # 상태 확인
            docker ps | grep damoa-frontend-dev
            echo ""
            echo "📊 최근 로그:"
            docker logs --tail=20 damoa-frontend-dev

      - name: Send Slack notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend Dev 배포 성공!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend 배포 성공* :rocket:\n*환경:* Development (EC2 빌드)\n*브랜치:* develop\n*작성자:* ${{ github.actor }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true

      - name: Send Slack notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "i-Damoa Frontend Dev 배포 실패!",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Frontend 배포 실패* :x:\n*환경:* Development (EC2 빌드)\n*브랜치:* develop\n*작성자:* ${{ github.actor }}\n*로그:* https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true
